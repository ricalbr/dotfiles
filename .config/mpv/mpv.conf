# mpv conf

# video / audio
vo=gpu
hwdec=auto-safe
video-sync=display-resample
alang=eng,en,ita,it,jpn,jp
volume-max=200

# subtitles (stabili)
slang=ita,it,eng,en,jpn,jp
sub-auto=fuzzy
sub-ass=yes
embeddedfonts=yes

sub-font=Sans
sub-font-size=36
sub-border-size=2
sub-color="#FFFFFF"
sub-border-color="#000000"

# ui / behavior
osc=no
border=no
ontop=yes
keep-open=yes
save-position-on-quit=yes
cursor-autohide=200

# screenshot
screenshot-format=png
screenshot-template=~/Pictures/Screenshot/mpv/%F_%p_%n

